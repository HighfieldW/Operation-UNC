<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0612">
  <title>Operation-UNC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <header class="hero">
        <canvas id="hero" role="img" aria-label="Operation-UNC"></canvas>
        <h1 class="sr-only">Operation-UNC</h1>
      </header>
      <div class="tiles">
        <div class="tile"><div class="label">Leads</div><div class="value" id="tLeads">0</div></div>
        <div class="tile"><div class="label">New</div><div class="value accent" id="tNew">0</div><div class="sub">last 12 hours</div></div>
        <div class="tile"><div class="label">Contacted</div><div class="value magenta" id="tContacted">0</div></div>
        <div class="tile"><div class="label">Communities</div><div class="value" id="tSources">0</div></div>
      </div>
    </section>

    <div class="bar">
      <p class="status" id="updated">booting</p>
    </div>

    <details class="panel trends" id="trends" open>
      <summary>Trends <span class="muted" id="trNote"></span></summary>
      <div class="trend-grid">
        <div class="tr-box wide"><h3>New posts per day</h3><div class="days" id="trDays"></div></div>
        <div class="tr-box"><h3>Busiest communities</h3><div id="trCommunities"></div></div>
        <div class="tr-box"><h3>Where leads come from</h3><div id="trSources"></div></div>
        <div class="tr-box"><h3>What people ask for</h3><div class="words" id="trFormats"></div></div>
        <div class="tr-box"><h3>Signals in the posts</h3><div id="trSignals"></div></div>
        <div class="tr-box"><h3>Common words in titles</h3><div class="words" id="trWords"></div></div>
        <div class="tr-box"><h3>Search terms that found leads</h3><div id="trKeywords"></div></div>
      </div>
    </details>

    <section class="controls">
      <label class="prompt"><span>&gt;</span><input id="search" type="search" placeholder="search leads" autocomplete="off"></label>
      <div class="chips" id="groups"></div>
      <label class="toggle"><input type="checkbox" id="hideDone"> hide contacted</label>
    </section>

    <main id="list" class="grid"></main>
    <p class="empty" id="empty" hidden></p>
  </div>

  <noscript><p class="empty">Operation-UNC needs JavaScript switched on to show leads.</p></noscript>
  <script src="rain.js"></script>
  <script>
    var contacted = {};
    try { contacted = JSON.parse(localStorage.getItem("contacted") || "{}"); } catch (e) {}
    function saveContacted() {
      try { localStorage.setItem("contacted", JSON.stringify(contacted)); } catch (e) {}
    }

    var leads = [];
    var activeGroup = "All";
    var $ = function (id) { return document.getElementById(id); };
    var NEW_HOURS = 12;

    function ago(iso) {
      var t = Date.parse(iso);
      if (isNaN(t)) return "";
      var mins = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (mins < 60) return mins + "m ago";
      var hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + "h ago";
      return Math.round(hrs / 24) + "d ago";
    }

    // Only allow links that really point at Reddit
    function safeUrl(u) {
      try {
        var x = new URL(u);
        if (x.protocol === "https:" && /(^|\.)reddit\.com$/.test(x.hostname)) return x.href;
      } catch (e) {}
      return null;
    }

    function isNew(l) { return Date.now() - Date.parse(l.found) < NEW_HOURS * 3600000; }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function renderChips() {
      var box = $("groups");
      box.textContent = "";
      var names = ["All"];
      leads.forEach(function (l) { if (names.indexOf(l.group) < 0) names.push(l.group); });
      names.forEach(function (n) {
        var b = el("button", "chip" + (n === activeGroup ? " on" : ""), n);
        b.onclick = function () { activeGroup = n; renderChips(); render(); };
        box.appendChild(b);
      });
    }

    function render() {
      var q = $("search").value.toLowerCase();
      var hide = $("hideDone").checked;
      var list = $("list");
      list.textContent = "";

      var shown = leads.filter(function (l) {
        if (activeGroup !== "All" && l.group !== activeGroup) return false;
        if (hide && contacted[l.link]) return false;
        if (q && (l.title + " " + l.snippet + " " + l.community).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });

      var places = {};
      leads.forEach(function (l) { places[l.community] = 1; });
      $("tLeads").textContent = leads.length;
      $("tNew").textContent = leads.filter(isNew).length;
      $("tContacted").textContent = Object.keys(contacted).length;
      $("tSources").textContent = Object.keys(places).length;

      shown.forEach(function (l, i) {
        var card = el("article", "card" + (contacted[l.link] ? " done" : ""));
        card.style.animationDelay = Math.min(i * 40, 400) + "ms";

        var meta = el("div", "meta");
        meta.appendChild(el("span", "badge", l.community));
        meta.appendChild(el("span", "muted", ago(l.posted)));
        if (isNew(l)) meta.appendChild(el("span", "badge new", "new"));
        card.appendChild(meta);

        card.appendChild(el("h2", "", l.title.replace(/^[\s'"*]+|[\s'"*]+$/g, "")));
        if (l.snippet) card.appendChild(el("p", "snippet", l.snippet));

        if (l.also && l.also.length) {
          var also = el("p", "also");
          also.appendChild(document.createTextNode("also posted in "));
          l.also.forEach(function (x, i) {
            var u = safeUrl(x.link);
            if (i) also.appendChild(document.createTextNode(", "));
            if (u) {
              var ax = el("a", "", x.community);
              ax.href = u; ax.target = "_blank"; ax.rel = "noopener noreferrer";
              also.appendChild(ax);
            } else {
              also.appendChild(document.createTextNode(x.community));
            }
          });
          card.appendChild(also);
        }

        var foot = el("div", "foot");
        var url = safeUrl(l.link);
        if (url) {
          var a = el("a", "btn", "open on " + (l.platform || "Reddit").toLowerCase() + " ↗");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          foot.appendChild(a);
        }
        var label = el("label", "toggle");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!contacted[l.link];
        cb.onchange = function () {
          if (cb.checked) contacted[l.link] = 1; else delete contacted[l.link];
          saveContacted();
          render();
        };
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" contacted"));
        foot.appendChild(label);
        card.appendChild(foot);

        list.appendChild(card);
      });

      var empty = $("empty");
      empty.hidden = shown.length > 0;
      empty.textContent = leads.length === 0
        ? "> no leads yet. run the workflow from the Actions tab and check back in a few minutes."
        : "> nothing matches those filters.";
    }

    // ---- Trends: worked out in the browser from the saved leads ----
    var STOP = {};
    ("a an the and or of to in on at for with from by is are was be been it its this that these those i im my me we our you your " +
     "us he she they them as if but not no so do does did have has had can could would should will just any some more most also " +
     "video videos editor editors editing edit looking look need needs needed hiring hire hired want wanted seeking who what where " +
     "how when why anyone someone people please help new good great best like get got really very one two much many other " +
     "per about into out up over than then there their ve ll re s t u ur etc").split(" ").forEach(function (w) { STOP[w] = 1; });

    var FORMATS = [
      ["YouTube", /youtub/i], ["Shorts / Reels / TikTok", /shorts?\b|reels?\b|tiktok|short[- ]form/i],
      ["Long form", /long[- ]form/i], ["Podcast", /podcast/i], ["Instagram", /instagram/i],
      ["Ads / UGC", /\bads?\b|\bugc\b|commercial/i], ["Course / coaching", /course|coach/i],
      ["Gaming", /gaming|gameplay|twitch/i], ["Documentary / film", /documentar|film|trailer/i],
      ["Ecommerce / product", /ecommerce|e-commerce|shopify|product/i]
    ];
    var SIGNALS = [
      ["Mentions pay or rate", /[$£€₹]\s?\d|\d\s?(\/|per)\s?(hr|hour|video|min)|\bpaid\b|budget|\brate\b|salary|retainer/i],
      ["Long-term or ongoing", /long[- ]term|ongoing|retainer|full[- ]time|part[- ]time|monthly|weekly/i],
      ["UK", /\buk\b|united kingdom|£|london|manchester|england|scotland|wales/i],
      ["India", /india|indian|₹|\binr\b|\blpa\b|\blakh|warangal|mumbai|delhi|bangalore|hyderabad|pune|chennai/i]
    ];

    function barList(box, entries, emptyText) {
      box.textContent = "";
      if (!entries.length) { box.appendChild(el("p", "muted", emptyText)); return; }
      var max = entries[0][1];
      entries.forEach(function (e) {
        var row = el("div", "brow");
        row.appendChild(el("span", "bname", e[0]));
        var track = el("span", "btrack");
        var fill = el("span", "bfill");
        fill.style.width = Math.max(4, Math.round(e[1] / max * 100)) + "%";
        track.appendChild(fill);
        row.appendChild(track);
        row.appendChild(el("span", "bnum", String(e[1])));
        box.appendChild(row);
      });
    }

    function tally(items) {
      var m = {};
      items.forEach(function (k) { if (k) m[k] = (m[k] || 0) + 1; });
      return Object.keys(m).map(function (k) { return [k, m[k]]; })
        .sort(function (a, b) { return b[1] - a[1]; });
    }

    // Hovering a cut-off label shows its full text in a bubble just below the cursor
    var tip = document.createElement("div");
    tip.className = "tip";
    tip.hidden = true;
    document.body.appendChild(tip);

    function moveTip(e) {
      var pad = 14;
      var x = Math.min(e.clientX + pad, window.innerWidth - tip.offsetWidth - 8);
      var y = e.clientY + 22;
      if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 12;
      tip.style.left = Math.max(8, x) + "px";
      tip.style.top = Math.max(8, y) + "px";
    }
    function cutLabel(target) {
      var row = target.closest ? target.closest("#trends .brow") : null;
      if (!row) return null;
      var name = row.querySelector(".bname");
      if (!name) return null;
      name.title = name.textContent;               // long-press fallback on phones
      return name.scrollWidth > name.clientWidth + 1 ? name.textContent : null;
    }
    document.addEventListener("mouseover", function (e) {
      var full = cutLabel(e.target);
      if (!full) { tip.hidden = true; return; }
      tip.textContent = full;
      tip.hidden = false;
      moveTip(e);
    });
    document.addEventListener("mousemove", function (e) { if (!tip.hidden) moveTip(e); });
    document.addEventListener("mouseout", function (e) { if (!e.relatedTarget) tip.hidden = true; });

    function renderTrends() {
      var n = leads.length;
      $("trNote").textContent = n ? "from " + n + " leads" : "";
      var text = function (l) { return (l.title + " " + (l.snippet || "")); };

      // posts per day (by when the post was made), last 14 days
      var days = {}, keys = [], i;
      for (i = 13; i >= 0; i--) {
        var d = new Date(Date.now() - i * 86400000), k = d.toISOString().slice(0, 10);
        days[k] = 0; keys.push(k);
      }
      leads.forEach(function (l) { var k = (l.posted || "").slice(0, 10); if (k in days) days[k]++; });
      var top = Math.max.apply(null, keys.map(function (k) { return days[k]; }).concat([1]));
      var box = $("trDays"); box.textContent = "";
      keys.forEach(function (k) {
        var col = el("div", "dcol");
        col.title = k + ": " + days[k];
        col.appendChild(el("span", "dnum", days[k] ? String(days[k]) : ""));
        var bar = el("span", "dbar");
        bar.style.height = Math.round(days[k] / top * 100) + "%";
        col.appendChild(bar);
        col.appendChild(el("span", "dlab", k.slice(8) + "/" + k.slice(5, 7)));
        box.appendChild(col);
      });

      barList($("trCommunities"), tally(leads.map(function (l) { return l.community; })).slice(0, 8), "no data yet");
      barList($("trSources"), tally(leads.map(function (l) { return l.group; })), "no data yet");

      // what people ask for
      var f = FORMATS.map(function (x) { return [x[0], leads.filter(function (l) { return x[1].test(text(l)); }).length]; })
        .filter(function (x) { return x[1] > 0; }).sort(function (a, b) { return b[1] - a[1]; });
      var fb = $("trFormats"); fb.textContent = "";
      if (!f.length) fb.appendChild(el("p", "muted", "no data yet"));
      f.forEach(function (x) { var c = el("span", "word"); c.textContent = x[0] + " "; c.appendChild(el("b", "", String(x[1]))); fb.appendChild(c); });

      // signals as a share of all leads
      var sig = SIGNALS.map(function (x) { return [x[0], leads.filter(function (l) { return x[1].test(text(l)); }).length]; });
      var sb = $("trSignals"); sb.textContent = "";
      sig.forEach(function (x) {
        var row = el("div", "brow");
        row.appendChild(el("span", "bname", x[0]));
        var track = el("span", "btrack"), fill = el("span", "bfill");
        fill.style.width = (n ? Math.round(x[1] / n * 100) : 0) + "%";
        track.appendChild(fill); row.appendChild(track);
        row.appendChild(el("span", "bnum", n ? Math.round(x[1] / n * 100) + "%" : "0%"));
        sb.appendChild(row);
      });

      // common words in titles
      var words = [];
      leads.forEach(function (l) {
        var seen = {};
        (l.title.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g) || []).forEach(function (w) {
          if (w.length > 2 && !STOP[w] && !seen[w]) { seen[w] = 1; words.push(w); }
        });
      });
      var wb = $("trWords"); wb.textContent = "";
      var tw = tally(words).filter(function (x) { return x[1] > 1; }).slice(0, 16);
      if (!tw.length) wb.appendChild(el("p", "muted", "no data yet"));
      tw.forEach(function (x) { var c = el("span", "word"); c.textContent = x[0] + " "; c.appendChild(el("b", "", String(x[1]))); wb.appendChild(c); });

      // which search term found each lead (only recorded for newer leads)
      var kws = leads.filter(function (l) { return l.matched; });
      barList($("trKeywords"), tally(kws.map(function (l) { return l.matched.toLowerCase(); })).slice(0, 8),
        "recording from now on: this fills in as new leads arrive");
    }

    $("search").oninput = render;
    $("hideDone").onchange = render;

    fetch("leads.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        leads = data.leads || [];
        var d = new Date(data.updated);
        $("updated").textContent = isNaN(d) ? "" : "last check " + ago(data.updated) + " (" + d.toLocaleString() + ")";
        if (data.stats) {
          var s = data.stats;
          var note = s.searches_ok + " searches this run";
          if (s.rate_limited) note += " | reddit asked us to slow down, resuming next hour";
          else if (s.searches_failed) note += " | " + s.searches_failed + " failed";
          if (s.f5bot) {
            if (!s.f5bot.configured) note += " | f5bot inbox not connected";
            else if (s.f5bot.error) note += " | f5bot inbox problem: " + s.f5bot.error;
            else note += " | f5bot: " + s.f5bot.emails + " emails read";
          }
          $("updated").textContent += " | " + note;
        }
        renderChips();
        render();
        renderTrends();
      })
      .catch(function () {
        $("updated").textContent = "no data yet";
        $("empty").hidden = false;
        $("empty").textContent = "> no data yet. run the workflow once from the Actions tab, then refresh.";
      });
  </script>
</body>
</html>

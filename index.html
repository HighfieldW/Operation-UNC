<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#010603">
  <title>Operation-UNC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="scan" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <canvas id="hero" role="img" aria-label="Operation-UNC"></canvas>
      <h1 class="sr-only">Operation-UNC</h1>
    </header>

    <div class="bar">
      <p class="status" id="updated">booting</p>
      <p class="stats" id="stats"></p>
    </div>

    <section class="controls">
      <label class="prompt"><span>&gt;</span><input id="search" type="search" placeholder="search leads" autocomplete="off"></label>
      <div class="chips" id="groups"></div>
      <label class="toggle"><input type="checkbox" id="hideDone"> hide contacted</label>
    </section>

    <main id="list" class="grid"></main>
    <p class="empty" id="empty" hidden></p>
  </div>

  <noscript><p class="empty">Operation-UNC needs JavaScript switched on to show leads.</p></noscript>
  <script src="rain.js"></script>
  <script>
    var contacted = {};
    try { contacted = JSON.parse(localStorage.getItem("contacted") || "{}"); } catch (e) {}
    function saveContacted() {
      try { localStorage.setItem("contacted", JSON.stringify(contacted)); } catch (e) {}
    }

    var leads = [];
    var activeGroup = "All";
    var $ = function (id) { return document.getElementById(id); };
    var NEW_HOURS = 12;

    function ago(iso) {
      var t = Date.parse(iso);
      if (isNaN(t)) return "";
      var mins = Math.max(0, Math.round((Date.now() - t) / 60000));
      if (mins < 60) return mins + "m ago";
      var hrs = Math.round(mins / 60);
      if (hrs < 24) return hrs + "h ago";
      return Math.round(hrs / 24) + "d ago";
    }

    // Only allow links that really point at Reddit
    function safeUrl(u) {
      try {
        var x = new URL(u);
        if (x.protocol === "https:" && /(^|\.)reddit\.com$/.test(x.hostname)) return x.href;
      } catch (e) {}
      return null;
    }

    function isNew(l) { return Date.now() - Date.parse(l.found) < NEW_HOURS * 3600000; }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function renderChips() {
      var box = $("groups");
      box.textContent = "";
      var names = ["All"];
      leads.forEach(function (l) { if (names.indexOf(l.group) < 0) names.push(l.group); });
      names.forEach(function (n) {
        var b = el("button", "chip" + (n === activeGroup ? " on" : ""), n);
        b.onclick = function () { activeGroup = n; renderChips(); render(); };
        box.appendChild(b);
      });
    }

    function render() {
      var q = $("search").value.toLowerCase();
      var hide = $("hideDone").checked;
      var list = $("list");
      list.textContent = "";

      var shown = leads.filter(function (l) {
        if (activeGroup !== "All" && l.group !== activeGroup) return false;
        if (hide && contacted[l.link]) return false;
        if (q && (l.title + " " + l.snippet + " " + l.community).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });

      $("stats").textContent = leads.length + " leads | " + leads.filter(isNew).length + " new | " +
        Object.keys(contacted).length + " contacted";

      shown.forEach(function (l, i) {
        var card = el("article", "card" + (contacted[l.link] ? " done" : ""));
        card.style.animationDelay = Math.min(i * 40, 400) + "ms";

        var meta = el("div", "meta");
        meta.appendChild(el("span", "badge", l.community));
        meta.appendChild(el("span", "muted", ago(l.posted)));
        if (isNew(l)) meta.appendChild(el("span", "badge new", "new"));
        card.appendChild(meta);

        card.appendChild(el("h2", "", l.title));
        if (l.snippet) card.appendChild(el("p", "snippet", l.snippet));

        var foot = el("div", "foot");
        var url = safeUrl(l.link);
        if (url) {
          var a = el("a", "btn", "open on " + (l.platform || "Reddit").toLowerCase() + " ↗");
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          foot.appendChild(a);
        }
        var label = el("label", "toggle");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!contacted[l.link];
        cb.onchange = function () {
          if (cb.checked) contacted[l.link] = 1; else delete contacted[l.link];
          saveContacted();
          render();
        };
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" contacted"));
        foot.appendChild(label);
        card.appendChild(foot);

        list.appendChild(card);
      });

      var empty = $("empty");
      empty.hidden = shown.length > 0;
      empty.textContent = leads.length === 0
        ? "> no leads yet. run the workflow from the Actions tab and check back in a few minutes."
        : "> nothing matches those filters.";
    }

    $("search").oninput = render;
    $("hideDone").onchange = render;

    fetch("leads.json?t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        leads = data.leads || [];
        var d = new Date(data.updated);
        $("updated").textContent = isNaN(d) ? "" : "last check " + ago(data.updated) + " (" + d.toLocaleString() + ")";
        if (data.stats) {
          var s = data.stats;
          var note = s.searches_ok + " searches this run";
          if (s.rate_limited) note += " | reddit asked us to slow down, resuming next hour";
          else if (s.searches_failed) note += " | " + s.searches_failed + " failed";
          $("updated").textContent += " | " + note;
        }
        renderChips();
        render();
      })
      .catch(function () {
        $("updated").textContent = "no data yet";
        $("empty").hidden = false;
        $("empty").textContent = "> no data yet. run the workflow once from the Actions tab, then refresh.";
      });
  </script>
</body>
</html>

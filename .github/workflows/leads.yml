name: Find video editor leads

on:
  schedule:
    - cron: "0 * * * *"   # every hour, in small batches
  workflow_dispatch:         # adds a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: lead-finder
  cancel-in-progress: false

jobs:
  find-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search Reddit
        timeout-minutes: 30
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python leads.py

      - name: Save leads for the dashboard
        if: always()
        run: |
          git config user.name "lead-bot"
          git config user.email "lead-bot@users.noreply.github.com"
          git add leads.json
          if ! git diff --cached --quiet; then
            git commit -m "Update leads"
            git pull --rebase
            git push
          fi
